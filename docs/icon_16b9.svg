<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b2b"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa4ff"/>
      <stop offset="1" stop-color="#3a63e8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <g transform="translate(960 440)">
    <rect x="-210" y="-184" width="420" height="420" rx="100" fill="#000" opacity="0.45"/>
    <rect x="-210" y="-210" width="420" height="420" rx="100" fill="url(#badge)"/>
    <rect x="-210" y="-210" width="420" height="420" rx="100" fill="url(#shine)"/>
    <rect x="-208.5" y="-208.5" width="417" height="417" rx="99" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
    <text x="0" y="118" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="330" fill="#ffffff">A</text>
  </g>

  <text x="960" y="810" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="112" letter-spacing="-2" fill="#f2f4f8">Aaron's TV Portal</text>
  <text x="960" y="880" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="500" font-size="40" letter-spacing="14" fill="#8e97ad">SAMSUNG TV HOME</text>
</svg>
