<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f2e"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- grid mark -->
  <g transform="translate(560 300)">
    <g fill="#f2f4f8">
      <rect x="0" y="0" width="220" height="220" rx="48"/>
      <rect x="260" y="0" width="220" height="220" rx="48"/>
      <rect x="0" y="260" width="220" height="220" rx="48"/>
    </g>
    <rect x="260" y="260" width="220" height="220" rx="48" fill="#4f8cff"/>
  </g>
  <!-- wordmark -->
  <text x="1120" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="200" letter-spacing="-6" fill="#f2f4f8">Portal</text>
</svg>
