<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2033"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa4ff"/>
      <stop offset="1" stop-color="#3a63e8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <g transform="translate(256 150)">
    <rect x="-108" y="-96" width="216" height="216" rx="52" fill="#000" opacity="0.45"/>
    <rect x="-108" y="-108" width="216" height="216" rx="52" fill="url(#badge)"/>
    <rect x="-108" y="-108" width="216" height="216" rx="52" fill="url(#shine)"/>
    <rect x="-107" y="-107" width="214" height="214" rx="51" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <text x="0" y="62" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="170" fill="#ffffff">A</text>
  </g>

  <text x="256" y="330" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="64" letter-spacing="-1.5" fill="#ffffff">Aaron's</text>
  <text x="256" y="396" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="64" letter-spacing="-1.5" fill="#ffffff">TV Portal</text>
