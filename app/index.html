<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aaron's Samsung TV Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    </div>
  </header>

  <section id="left">
    <div id="clock"></div>
    <div id="date"></div>
    <div id="apps"></div>
  </section>

  <aside id="panel">
    <div id="weather">
      <div id="weather-icon"></div>
      <div id="weather-text">
        <div id="temp"></div>
        <div id="conditions"></div>
        <div id="range"></div>
      </div>
    </div>
    <div id="month-title"></div>
    <div id="month"></div>
  </aside>

  <div id="toast"></div>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
