<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aaron's Samsung TV Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title"></h1>
    <div id="gear" title="Change theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 0 0 0 18c1.2 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.2 0-1.1.9-2 2-2h2.3A4.7 4.7 0 0 0 22 9.8C22 6 17.5 3 12 3z"/><circle cx="7.5" cy="11.5" r="1.2"/><circle cx="10.5" cy="7.5" r="1.2"/><circle cx="15.5" cy="7.5" r="1.2"/></svg>
    </div>
  </header>

  <section id="left">
    <div id="clock"></div>
    <div id="date"></div>
    <div id="apps"></div>
  </section>

  <aside id="panel">
    <div id="weather">
      <div id="weather-icon"></div>
      <div id="weather-text">
        <div id="temp"></div>
        <div id="conditions"></div>
        <div id="range"></div>
      </div>
    </div>
    <div id="month-title"></div>
    <div id="month"></div>
  </aside>

  <div id="toast"></div>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
